name: Ingest News

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"

  # Enable manual run via Actions tab
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger News Ingestion
        run: |
          curl --fail-with-body \
            --max-time 1800 \
            -X POST \
            "${{ secrets.INGEST_API_URL }}" \
            -H "Content-Type: application/json" \
            -H "Content-Length: 0" \
            -H "X-Admin-Api-Key: ${{ secrets.ADMIN_API_KEY }}"
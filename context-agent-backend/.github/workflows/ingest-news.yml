name: Ingest News

on:
  schedule:
    # Run every 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch: # Enable manual run via Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger News Ingestion
        run: |
          curl --fail-with-body \
            --max-time 600 \
            -X POST \
            "${{ secrets.INGEST_API_URL }}" \
            -H "X-Admin-Api-Key: ${{ secrets.ADMIN_API_KEY }}"

services:
  db:
    image: postgres:15-alpine
    container_name: context-agent-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - context-agent-net

  redis:
    image: redis:7-alpine
    container_name: context-agent-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - context-agent-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: context-agent-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - context-agent-net

  adminer:
    image: adminer:latest
    container_name: context-agent-adminer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - context-agent-net

  celery_worker:
    build: .
    container_name: context-agent-worker
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=info --pool=solo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://context_agent:changeme@db:5432/context_agent
      SYNC_DATABASE_URL: postgresql://context_agent:changeme@db:5432/context_agent
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
    volumes:
      - C:\Users\yasha\AppData\Roaming\gcloud\application_default_credentials.json:/root/.config/gcloud/application_default_credentials.json:ro
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    networks:
      - context-agent-net

  celery_beat:
    build: .
    container_name: context-agent-beat
    command: celery -A app.worker.celery_app.celery_app beat --loglevel=info
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://context_agent:changeme@db:5432/context_agent
      SYNC_DATABASE_URL: postgresql://context_agent:changeme@db:5432/context_agent
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - context-agent-net

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  context-agent-net:
    driver: bridge
